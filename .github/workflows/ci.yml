name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Type-check & unit suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm before setup-node so setup-node's pnpm cache resolver can find it.
      # Version is pinned here rather than via a packageManager field in
      # package.json, which would also change the pnpm Vercel builds with.
      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # tsc --noEmit. Named "lint" by the script, but there is no ESLint here.
      - name: Type-check
        run: pnpm lint

      # Each suite runs even if an earlier one fails, so a single run reports
      # every broken suite instead of only the first.
      - name: tests/ocr
        if: '!cancelled()'
        run: pnpm test:ocr

      - name: tests/pdf
        if: '!cancelled()'
        run: pnpm test:pdf

      - name: tests/pipeline
        if: '!cancelled()'
        run: pnpm test:pipeline

      - name: tests/security
        if: '!cancelled()'
        run: pnpm test:security

      - name: tests/accounting
        if: '!cancelled()'
        run: pnpm test:export

  accounting-regression:
    name: Accounting worker regression (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: workers/accounting_worker/requirements.txt

      # run_regression.sh prefers workers/accounting_worker/.venv and treats a
      # missing test dependency as a hard failure rather than a silent skip, so
      # the venv is created at exactly that path (matching the local setup in
      # CLAUDE.md) instead of installing into the system interpreter.
      - name: Install worker dependencies
        working-directory: workers/accounting_worker
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt

      # Invoked directly rather than through `pnpm test:accounting-regression`,
      # so this job needs no Node toolchain.
      - name: Regression suite
        run: ./workers/accounting_worker/tests/run_regression.sh

  e2e:
    # NON-BLOCKING. The Playwright suite has 3 failures that predate this
    # workflow (verified at 81227c3, before #60):
    #   app-smoke.spec.ts:11        desktop new menu links to routed workspaces
    #   app-smoke.spec.ts:27        mobile bottom navigation / profile menu
    #   conversion-engine.spec.ts:293  PDF page image export without a renderer
    # Running it here surfaces those and any new breakage without blocking
    # merges. Remove continue-on-error once the three are fixed.
    name: E2E (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Both Playwright projects (Desktop Chrome, iPhone 13) are Chromium.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # playwright.config.ts starts `next dev -p 3100` itself via webServer.
      - name: Playwright
        run: pnpm test

      - name: Upload report
        if: '!cancelled()'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
