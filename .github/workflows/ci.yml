name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Type-check & unit suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm before setup-node so setup-node's pnpm cache resolver can find it.
      # Version is pinned here rather than via a packageManager field in
      # package.json, which would also change the pnpm Vercel builds with.
      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # tsc --noEmit. Named "lint" by the script, but there is no ESLint here.
      - name: Type-check
        run: pnpm lint

      # Each suite runs even if an earlier one fails, so a single run reports
      # every broken suite instead of only the first.
      - name: tests/conversion
        if: '!cancelled()'
        run: pnpm test:conversion

      - name: tests/ocr
        if: '!cancelled()'
        run: pnpm test:ocr

      - name: tests/pdf
        if: '!cancelled()'
        run: pnpm test:pdf

      - name: tests/pipeline
        if: '!cancelled()'
        run: pnpm test:pipeline

      - name: tests/security
        if: '!cancelled()'
        run: pnpm test:security

      - name: tests/accounting
        if: '!cancelled()'
        run: pnpm test:export

  accounting-regression:
    # Removed in #61 because the statement cases pinned two real FNB PDFs by
    # absolute path on one machine, so this could only ever fail here. They are
    # now generated as sanitised fixtures, so the suite is portable.
    name: Accounting worker regression (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: workers/accounting_worker/requirements.txt

      # run_regression.sh prefers workers/accounting_worker/.venv and treats a
      # missing test dependency as a hard failure rather than a silent skip, so
      # the venv is created at exactly that path (matching the local setup in
      # CLAUDE.md) instead of installing into the system interpreter.
      - name: Install worker dependencies
        working-directory: workers/accounting_worker
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt

      # Invoked directly rather than through `pnpm test:accounting-regression`,
      # so this job needs no Node toolchain.
      - name: Regression suite
        run: ./workers/accounting_worker/tests/run_regression.sh

  e2e:
    # BLOCKING. It was continue-on-error while the suite carried failures that
    # predated the workflow; those are now fixed (#62, #63) and it has run clean
    # twice — on #63 and on main at aa002f6, 22 passed / 20 skipped / 0 failed.
    #
    # A failure here now stops a merge, so treat a red run as a real signal
    # rather than something to re-run. `pnpm test` locally reproduces this job:
    # playwright.config.ts blanks the Supabase variables for its own dev server
    # and refuses to reuse one left on port 3100, so a developer with a real
    # .env.local sees the same app CI does. That was not true before #69, when a
    # local run redirected every protected route to /login and could not
    # exercise the app shell at all.
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # tests/e2e/conversion-engine.spec.ts drives lib/document-conversion-engine.ts,
      # which shells out to these. On a bare runner they are absent and the PDF
      # text/OCR/render cases fail for want of tooling rather than for a real
      # defect. The list mirrors workers/conversion_worker/Dockerfile:19-28 so CI
      # matches the image those paths actually run in (minus ca-certificates,
      # git and python3, already present here). libreoffice is the slow one.
      - name: Install conversion tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ghostscript \
            libreoffice \
            ocrmypdf \
            poppler-utils \
            qpdf \
            tesseract-ocr \
            tesseract-ocr-eng

      # Desktop Chrome is Chromium; iPhone 13 is WebKit
      # (devices["iPhone 13"].defaultBrowserType === "webkit"). Installing only
      # chromium failed every mobile-project test at browser launch.
      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      # playwright.config.ts starts `next dev -p 3100` itself via webServer.
      - name: Playwright
        run: pnpm test

      - name: Upload report
        if: '!cancelled()'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
