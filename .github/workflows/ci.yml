name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Type-check & unit suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm before setup-node so setup-node's pnpm cache resolver can find it.
      # Version is pinned here rather than via a packageManager field in
      # package.json, which would also change the pnpm Vercel builds with.
      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # tsc --noEmit. Named "lint" by the script, but there is no ESLint here.
      - name: Type-check
        run: pnpm lint

      # Each suite runs even if an earlier one fails, so a single run reports
      # every broken suite instead of only the first.
      - name: tests/conversion
        if: '!cancelled()'
        run: pnpm test:conversion

      - name: tests/ocr
        if: '!cancelled()'
        run: pnpm test:ocr

      - name: tests/pdf
        if: '!cancelled()'
        run: pnpm test:pdf

      - name: tests/pipeline
        if: '!cancelled()'
        run: pnpm test:pipeline

      - name: tests/security
        if: '!cancelled()'
        run: pnpm test:security

      - name: tests/accounting
        if: '!cancelled()'
        run: pnpm test:export

  # NOT RUN HERE: pnpm test:accounting-regression.
  #
  # regression_suite.py:1047-1057 pins two real FNB statements by absolute path
  # under a specific machine's iCloud Drive, and asserts at :1166 that at least
  # one of them opened. Those PDFs are real financial documents, correctly not
  # committed, so the suite cannot pass on any machine but that one — a CI job
  # for it would fail permanently and mean nothing.
  #
  # The hard failure is deliberate (see the header of run_regression.sh: real
  # cases once silently returned when pdfplumber was missing, hiding a live
  # parser defect). Fixing this properly means committing sanitised fixtures and
  # pointing the cases at them, which is a change to the suite's own design and
  # out of scope here. Until then it stays a local, manually-run suite.

  e2e:
    # BLOCKING. It was continue-on-error while the suite carried failures that
    # predated the workflow; those are now fixed (#62, #63) and it has run clean
    # twice — on #63 and on main at aa002f6, 22 passed / 20 skipped / 0 failed.
    #
    # A failure here now stops a merge, so treat a red run as a real signal
    # rather than something to re-run. Two things worth knowing if it does go
    # red unexpectedly:
    #   - playwright.config.ts sets `reuseExistingServer: true`, so locally it
    #     will silently test whatever already listens on 3100.
    #   - a local run is NOT equivalent to this one. middleware.ts forces
    #     authRequired whenever NEXT_PUBLIC_SUPABASE_URL is set, ignoring
    #     NEXT_PUBLIC_REQUIRE_AUTH, so a developer with .env.local gets
    #     /login redirects for every protected route while CI does not.
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # tests/e2e/conversion-engine.spec.ts drives lib/document-conversion-engine.ts,
      # which shells out to these. On a bare runner they are absent and the PDF
      # text/OCR/render cases fail for want of tooling rather than for a real
      # defect. The list mirrors workers/conversion_worker/Dockerfile:19-28 so CI
      # matches the image those paths actually run in (minus ca-certificates,
      # git and python3, already present here). libreoffice is the slow one.
      - name: Install conversion tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ghostscript \
            libreoffice \
            ocrmypdf \
            poppler-utils \
            qpdf \
            tesseract-ocr \
            tesseract-ocr-eng

      # Desktop Chrome is Chromium; iPhone 13 is WebKit
      # (devices["iPhone 13"].defaultBrowserType === "webkit"). Installing only
      # chromium failed every mobile-project test at browser launch.
      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      # playwright.config.ts starts `next dev -p 3100` itself via webServer.
      - name: Playwright
        run: pnpm test

      - name: Upload report
        if: '!cancelled()'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
